[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodflow"
version = "1.0.0"
description = "Training-free lesion-constrained flow matching for 3D lung nodule synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "nibabel>=5.0",
  "torch>=2.0",
  "pydicom>=2.4",
]

[project.optional-dependencies]
generative = [
  "diffusers>=0.27",
  "huggingface-hub>=0.23",
  "monai>=1.3",
  "omegaconf>=2.3",
  "torchvision>=0.15",
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["src*", "data_tools*"]

[tool.ruff]
line-length = 100
target-version = "py310"
